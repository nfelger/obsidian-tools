name: E2E Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Exercise the exact bytes produced by the shared quality gate.
      - uses: actions/download-artifact@v4
        with:
          name: checked-build-${{ github.run_attempt }}
          path: .

      - name: Cache Obsidian binary
        uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-${{ runner.os }}-latest

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-herbstluftwm-${{ runner.os }}

      - name: Set up virtual display
        timeout-minutes: 5
        run: |
          sudo apt-get install -y herbstluftwm

          export DISPLAY=:99
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1280x1024x24 -ac +extension GLX -noreset > /tmp/bullet-flow-xvfb.log 2>&1 &
          sleep 2
          herbstluftwm > /tmp/bullet-flow-wm.log 2>&1 &
          sleep 1

      - name: Run E2E tests
        run: npm run test:e2e 2>&1 | tee e2e-output.txt; exit ${PIPESTATUS[0]}

      - name: Upload E2E test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-output-${{ github.run_attempt }}
          path: e2e-output.txt

      - name: Save Obsidian cache on failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .obsidian-cache
          key: obsidian-${{ runner.os }}-latest
