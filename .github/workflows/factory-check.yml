name: Factory controller checks
on:
  pull_request:
    branches: [main]
  push:
    branches: ['factory/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: factory/package-lock.json
      - run: npm ci
        working-directory: factory
      - run: npm run check
        working-directory: factory
