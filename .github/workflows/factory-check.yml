name: Factory controller checks
on:
  pull_request:
    branches: [main]
  push:
    branches: ['factory/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: factory/package-lock.json
      - run: npm ci
        working-directory: factory
      - run: npm run check
        working-directory: factory
      - name: Check runtime in coding container image
        run: |
          fixture=$(mktemp -d)
          mkdir "$fixture/workspace" "$fixture/output"
          cp package.json package-lock.json "$fixture/workspace/"
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/factory:/runtime:ro" \
            -v "$fixture/workspace:/workspace" -v "$fixture/output:/output" \
            node:22-bookworm bash -ec '
              export HOME=/tmp
              cp -a --no-preserve=ownership /runtime /tmp/factory
              cd /workspace
              npm ci --ignore-scripts
              test -d node_modules
              echo writable > /output/probe
              cd /tmp/factory
              npm test'
          test "$(cat "$fixture/output/probe")" = writable
