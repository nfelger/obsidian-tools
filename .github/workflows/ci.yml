name: CI

on:
  push:
    branches: ['claude/**', 'factory/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Check and build
        run: npm run check
        env:
          # A main push compares with the preceding main commit, not itself.
          FALLOW_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
      - uses: actions/upload-artifact@v4
        with:
          name: checked-build-${{ github.run_attempt }}
          path: build/checked/
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs: test
    uses: ./.github/workflows/e2e.yml

  candidate:
    needs: [test, e2e]
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/download-artifact@v4
        with:
          name: checked-build-${{ github.run_attempt }}
          path: build/checked
      - name: Package checked candidate
        id: package
        run: node candidate-package.mjs
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: build/candidate/
          if-no-files-found: error
          retention-days: 90
