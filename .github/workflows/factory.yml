name: Issue factory
on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['factory/issue-*']
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
jobs:
  acknowledge:
    if: github.event_name == 'issue_comment' && github.event.comment.user.login == github.repository_owner && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: node --experimental-strip-types controller.ts --acknowledge
        working-directory: factory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  reconcile:
    needs: acknowledge
    concurrency:
      group: issue-factory-controller
      cancel-in-progress: false
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_repository.full_name == github.repository)) &&
      (github.event_name != 'issue_comment' ||
        (github.event.comment.user.login == github.repository_owner && !github.event.issue.pull_request))
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: factory/package-lock.json
      - run: npm ci
        working-directory: factory
      - run: node --import tsx controller.ts
        working-directory: factory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          IMPLEMENTER_MODEL: ${{ vars.IMPLEMENTER_MODEL }}
          ESCALATION_MODEL: ${{ vars.ESCALATION_MODEL }}
          PLANNER_MODEL: ${{ vars.PLANNER_MODEL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coding-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/factory-code-*/output/result.json
            ${{ runner.temp }}/factory-patch.json
            ${{ runner.temp }}/factory-state-checkpoint.json
          if-no-files-found: ignore
          retention-days: 14
