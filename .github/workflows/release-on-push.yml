name: Stable Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Do not let an older main build publish after a newer stable release.
concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: checked-build-${{ github.run_attempt }}
          path: build/checked
      - name: Verify build identity and assets
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const dir = 'build/checked/';
          const report = JSON.parse(readFileSync(dir + 'quality.json'));
          if (report.sourceSha !== process.env.EXPECTED_SHA) throw new Error('Wrong build commit');
          for (const name of ['main.js', 'manifest.json', 'styles.css']) {
            const hash = createHash('sha256').update(readFileSync(dir + name)).digest('hex');
            if (hash !== report.assets[name]) throw new Error(`Changed asset: ${name}`);
          }
          const manifest = JSON.parse(readFileSync(dir + 'manifest.json'));
          if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) throw new Error('Expected stable version');
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${manifest.version}\n`);
          JS
      - name: Check whether stable tag already exists
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Distinguish a missing tag from authentication/network failures.
          status=$(gh api -i "repos/$GH_REPO/git/ref/tags/$RELEASE_VERSION" > response.txt 2>&1 && echo found || echo failed)
          if [ "$status" = found ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP.* 404' response.txt; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat response.txt
            exit 1
          fi
      - name: Publish stable release
        if: steps.tag.outputs.exists == 'false'
        uses: ncipollo/release-action@v1
        with:
          artifacts: build/checked/main.js,build/checked/manifest.json,build/checked/styles.css,build/checked/quality.json
          artifactErrorsFailBuild: true
          immutableCreate: true
          commit: ${{ github.sha }}
          tag: ${{ env.RELEASE_VERSION }}
          name: v${{ env.RELEASE_VERSION }}
          body: |
            Stable Bullet Flow build from ${{ github.sha }}.

            Lint, coverage, code audit, build, and desktop Obsidian E2E passed.
            Checks: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            See CHANGELOG.md for changes and docs/AUTO-DEPLOY.md for installation.
          prerelease: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
